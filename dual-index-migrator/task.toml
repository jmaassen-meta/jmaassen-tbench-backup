name = "1_dual_format_index"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0

[[steps]]
name = "2_atomic_changeset"
dependencies = ["1_dual_format_index"]
min_reward = 0.6
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0

[[steps]]
name = "3_backfill_gc"
dependencies = ["2_atomic_changeset"]
min_reward = 0.6
