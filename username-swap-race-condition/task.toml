schema_version = "1.1"

[task]
name = "codimango/username-swap-race-condition"
description = "Fix race condition in username swap between users across three DB tables"
authors = [{ name = "jmaassen", email = "jmaassen@meta.com" }]
keywords = ["race-condition", "concurrency", "database", "username"]

[metadata]
author_name = "jmaassen"
author_email = "jmaassen@meta.com"
difficulty = "medium"
category = "concurrency"
category_usecase = "concurrency_bugs"
category_subdomain = "web_backend"
languages = ["python"]
tags = ["race-condition", "threading", "database", "concurrency"]
expert_time_estimate_min = 20.0
junior_time_estimate_min = 45.0

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Isolation is
# opt-out — delete this line only if your verifier must share the agent env.
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
